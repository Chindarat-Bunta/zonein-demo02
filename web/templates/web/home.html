{% extends "web/base.html" %}

{% block title %}ZoneIn - ฟีดรีวิวสถานที่ท่องเที่ยว{% endblock %}

{% block extra_head %}
<style>
    /* Stories / Highlights Strip (Instagram Style) */
    .stories-container {
        padding: 0.85rem 0.75rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        gap: 0.95rem;
        overflow-x: auto;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
    }

    .stories-container::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
    }

    .story-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
        flex-shrink: 0;
        width: 72px;
        text-decoration: none;
    }

    .story-ring {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        padding: 2.5px;
        background: var(--ig-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }

    .story-item:hover .story-ring {
        transform: scale(1.05);
        box-shadow: 0 0 12px var(--ig-story-glow);
    }

    .story-avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--bg-body);
        background: #1e293b;
    }

    .story-title {
        font-size: 0.72rem;
        color: #fff;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        font-weight: 500;
    }

    /* Instagram Feed Post Card */
    .ig-feed-list {
        display: flex;
        flex-direction: column;
    }

    .ig-post-card {
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-body);
        display: flex;
        flex-direction: column;
    }

    /* Post Header */
    .ig-post-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.65rem 0.85rem;
    }

    .ig-author-left {
        display: flex;
        align-items: center;
        gap: 0.65rem;
    }

    .ig-author-ring {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        padding: 2px;
        background: var(--ig-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .ig-author-avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #1e293b;
        border: 1.5px solid var(--bg-body);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
        color: #fff;
    }

    .ig-author-meta {
        display: flex;
        flex-direction: column;
        line-height: 1.25;
    }

    .ig-author-username {
        font-weight: 700;
        font-size: 0.88rem;
        color: #fff;
    }

    .ig-author-location {
        font-size: 0.75rem;
        color: var(--text-muted);
    }

    .ig-more-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0.4rem;
        border-radius: 50%;
    }

    /* Post Media Image */
    .ig-media-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #121212;
        overflow: hidden;
    }

    .ig-media-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        user-select: none;
    }

    /* Floating Double Tap Heart Animation */
    .double-tap-heart {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        color: #fff;
        opacity: 0;
        pointer-events: none;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        z-index: 10;
        filter: drop-shadow(0 0 15px rgba(225, 48, 108, 0.8));
    }

    .double-tap-heart.pop {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.95;
    }

    /* Post Actions Row */
    .ig-post-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.65rem 0.85rem 0.4rem;
    }

    .ig-actions-left {
        display: flex;
        align-items: center;
        gap: 0.95rem;
    }

    .ig-action-btn {
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease;
    }

    .ig-action-btn:active {
        transform: scale(1.25);
    }

    .ig-action-btn.liked svg {
        fill: #ed4956;
        stroke: #ed4956;
    }

    .ig-action-btn.saved svg {
        fill: #ffffff;
        stroke: #ffffff;
    }

    /* Post Information & Caption */
    .ig-post-info {
        padding: 0 0.85rem 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }

    .ig-rating-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: rgba(251, 191, 36, 0.12);
        border: 1px solid rgba(251, 191, 36, 0.3);
        color: var(--star-gold);
        font-size: 0.78rem;
        font-weight: 700;
        padding: 0.15rem 0.55rem;
        border-radius: var(--radius-full);
        width: fit-content;
    }

    .ig-likes-count {
        font-weight: 700;
        font-size: 0.88rem;
        color: #fff;
    }

    .ig-caption {
        font-size: 0.88rem;
        line-height: 1.45;
        color: var(--text-main);
        word-break: break-word;
    }

    .ig-caption-author {
        font-weight: 700;
        color: #fff;
        margin-right: 0.35rem;
    }

    .ig-place-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        color: #60a5fa;
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
    }

    .ig-comments-link {
        font-size: 0.82rem;
        color: var(--text-dim);
        cursor: pointer;
    }

    .ig-post-time {
        font-size: 0.72rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    /* Skeleton Loading Placeholder */
    .ig-skeleton-card {
        padding: 0.85rem;
        border-bottom: 1px solid var(--border-color);
    }

    .ig-skeleton-header {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 0.75rem;
    }

    .skeleton-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #1e293b;
    }

    .skeleton-line {
        height: 12px;
        background: #1e293b;
        border-radius: 4px;
    }

    .skeleton-media {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #1e293b;
        border-radius: var(--radius-sm);
        margin-bottom: 0.75rem;
    }

    .btn-ig-load-more {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 0.65rem 1.5rem;
        border-radius: var(--radius-full);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        margin: 1.5rem auto;
        display: block;
        transition: var(--transition-smooth);
    }

    .btn-ig-load-more:hover {
        color: #fff;
        border-color: #fff;
        background: rgba(255, 255, 255, 0.05);
    }
</style>
{% endblock %}

{% block content %}
    <!-- 1. Stories / Popular Places Carousel Strip -->
    <div class="stories-container" id="storiesContainer">
        <!-- Skeleton story circles -->
        <div class="story-item"><div class="story-ring" style="background: #262626;"><div class="story-avatar-img"></div></div><div class="story-title" style="background: #262626; height: 10px; border-radius: 3px; margin-top: 4px;"></div></div>
        <div class="story-item"><div class="story-ring" style="background: #262626;"><div class="story-avatar-img"></div></div><div class="story-title" style="background: #262626; height: 10px; border-radius: 3px; margin-top: 4px;"></div></div>
        <div class="story-item"><div class="story-ring" style="background: #262626;"><div class="story-avatar-img"></div></div><div class="story-title" style="background: #262626; height: 10px; border-radius: 3px; margin-top: 4px;"></div></div>
        <div class="story-item"><div class="story-ring" style="background: #262626;"><div class="story-avatar-img"></div></div><div class="story-title" style="background: #262626; height: 10px; border-radius: 3px; margin-top: 4px;"></div></div>
    </div>

    <!-- 2. Instagram Feed Posts Stream -->
    <div class="ig-feed-list" id="igFeedList">
        <!-- Loading Skeleton Card -->
        <div class="ig-skeleton-card">
            <div class="ig-skeleton-header">
                <div class="skeleton-avatar"></div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                    <div class="skeleton-line" style="width: 35%;"></div>
                    <div class="skeleton-line" style="width: 25%;"></div>
                </div>
            </div>
            <div class="skeleton-media"></div>
            <div class="skeleton-line" style="width: 40%; margin-bottom: 8px;"></div>
            <div class="skeleton-line" style="width: 75%;"></div>
        </div>
    </div>

    <button type="button" id="btnLoadMoreFeed" class="btn-ig-load-more" onclick="loadMoreFeed()" style="display: none;">
        โหลดโพสต์เพิ่มเติม
    </button>
{% endblock %}

{% block extra_scripts %}
<script>
let currentFeedPage = 1;
let hasNextFeedPage = false;
let isLoadingFeed = false;
const likedPostsSet = new Set();
const savedPostsSet = new Set();

document.addEventListener("DOMContentLoaded", () => {
    loadStoriesPlaces();
    loadFeedReviews(1);
});

function formatRelativeTime(dateString) {
    if (!dateString) return "";
    const now = new Date();
    const past = new Date(dateString);
    const diffSeconds = Math.max(0, Math.floor((now - past) / 1000));

    if (diffSeconds < 60) return "เมื่อสักครู่";
    const diffMinutes = Math.floor(diffSeconds / 60);
    if (diffMinutes < 60) return `${diffMinutes} นาทีที่แล้ว`;
    const diffHours = Math.floor(diffMinutes / 60);
    if (diffHours < 24) return `${diffHours} ชั่วโมงที่แล้ว`;
    const diffDays = Math.floor(diffHours / 24);
    if (diffDays === 1) return "1 วันที่แล้ว";
    if (diffDays < 30) return `${diffDays} วันที่แล้ว`;
    const diffMonths = Math.floor(diffDays / 30);
    if (diffMonths < 12) return `${diffMonths} เดือนที่แล้ว`;
    return `${Math.floor(diffDays / 365)} ปีที่แล้ว`;
}

// 1. Load Stories / Popular Places Strip
async function loadStoriesPlaces() {
    const container = document.getElementById("storiesContainer");
    try {
        const res = await fetch("/api/places/popular/?limit=10");
        if (!res.ok) throw new Error();
        const data = await res.json();
        const places = data.places || [];

        if (places.length === 0) {
            container.innerHTML = `<div style="color: var(--text-dim); font-size: 0.8rem; padding: 0.5rem 1rem;">ยังไม่มีไฮไลท์สถานที่</div>`;
            return;
        }

        container.innerHTML = places.map((p, idx) => {
            const fallbackImg = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300&auto=format&fit=crop&q=80";
            const imgUrl = p.image_url || fallbackImg;
            const shortName = p.name.length > 10 ? p.name.substring(0, 9) + "..." : p.name;

            return `
                <div class="story-item" onclick="showToast('สถานที่ยอดฮิต: ${p.name}')">
                    <div class="story-ring">
                        <img src="${imgUrl}" alt="${p.name}" class="story-avatar-img" onerror="this.src='${fallbackImg}'">
                    </div>
                    <span class="story-title" title="${p.name}">${shortName}</span>
                </div>
            `;
        }).join("");

    } catch (e) {
        console.error(e);
    }
}

// 2. Load Instagram Reviews Feed
async function loadFeedReviews(page = 1, append = false) {
    if (isLoadingFeed) return;
    isLoadingFeed = true;

    const container = document.getElementById("igFeedList");
    const loadMoreBtn = document.getElementById("btnLoadMoreFeed");

    try {
        const res = await fetch(`/api/reviews/recent/?page=${page}&limit=5`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const reviews = data.reviews || [];
        hasNextFeedPage = data.has_next;
        currentFeedPage = data.page;

        if (!append && reviews.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; color: var(--text-muted); padding: 4rem 1.5rem;">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">📷</div>
                    <div style="font-size: 1.1rem; font-weight: 700; color: #fff;">ยังไม่มีโพสต์ในฟีด</div>
                    <div style="font-size: 0.85rem; margin-top: 0.25rem;">ร่วมแบ่งปันรูปถ่ายและรีวิวคนแรกได้เลย!</div>
                </div>
            `;
            if (loadMoreBtn) loadMoreBtn.style.display = "none";
            return;
        }

        const cardsHtml = reviews.map(r => {
            const authorInitial = (r.author?.username || "T")[0].toUpperCase();
            const timeAgo = formatRelativeTime(r.created_at);
            const stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
            const fallbackImg = "https://images.unsplash.com/photo-1596422846543-75c6fc197f07?w=1000&auto=format&fit=crop&q=80";
            const imgUrl = r.image_url || fallbackImg;
            const fakeLikes = 18 + (r.id * 7);

            return `
                <article class="ig-post-card" id="post_card_${r.id}">
                    <!-- Post Header -->
                    <div class="ig-post-header">
                        <div class="ig-author-left">
                            <div class="ig-author-ring">
                                <div class="ig-author-avatar">${authorInitial}</div>
                            </div>
                            <div class="ig-author-meta">
                                <span class="ig-author-username">${r.author?.username || 'traveler'}</span>
                                ${r.place ? `<span class="ig-author-location">📍 ${r.place.name}</span>` : ''}
                            </div>
                        </div>
                        <button type="button" class="ig-more-btn" onclick="showToast('ตัวเลือกโพสต์')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="19" cy="12" r="1"></circle>
                                <circle cx="5" cy="12" r="1"></circle>
                            </svg>
                        </button>
                    </div>

                    <!-- Post Media with Double Tap Heart -->
                    <div class="ig-media-wrapper" ondblclick="triggerDoubleTapLike(${r.id})">
                        <img src="${imgUrl}" alt="${r.place?.name || 'รูปรีวิว'}" class="ig-media-img" loading="lazy">
                        <div class="double-tap-heart" id="heart_burst_${r.id}">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="#ed4956" stroke="#ed4956" stroke-width="1.5">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Post Actions Bar -->
                    <div class="ig-post-actions">
                        <div class="ig-actions-left">
                            <button type="button" class="ig-action-btn" id="like_btn_${r.id}" onclick="toggleLikePost(${r.id})">
                                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                            </button>
                            <button type="button" class="ig-action-btn" onclick="showToast('เปิดช่องแสดงความคิดเห็น')">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                                </svg>
                            </button>
                            <button type="button" class="ig-action-btn" onclick="sharePost(${r.id})">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                        <button type="button" class="ig-action-btn" id="save_btn_${r.id}" onclick="toggleSavePost(${r.id})">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Post Info & Caption -->
                    <div class="ig-post-info">
                        <div class="ig-rating-pill">★ ${r.rating}.0 • คะแนนความประทับใจ</div>
                        <div class="ig-likes-count" id="likes_text_${r.id}">ถูกใจ <span id="likes_val_${r.id}">${fakeLikes}</span> คน</div>
                        
                        <div class="ig-caption">
                            <span class="ig-caption-author">${r.author?.username || 'traveler'}</span>
                            ${r.content || ''}
                        </div>

                        ${r.place ? `
                            <a href="javascript:void(0)" class="ig-place-tag" onclick="showToast('ดูข้อมูลสถานที่: ${r.place.name}')">
                                📍 ${r.place.name} (${r.place.location || 'ประเทศไทย'})
                            </a>
                        ` : ''}

                        <div class="ig-comments-link" onclick="showToast('เปิดดูความคิดเห็นทั้งหมด')">ดูความคิดเห็นทั้งหมด</div>
                        <div class="ig-post-time">${timeAgo}</div>
                    </div>
                </article>
            `;
        }).join("");

        if (append) {
            container.insertAdjacentHTML("beforeend", cardsHtml);
        } else {
            container.innerHTML = cardsHtml;
        }

        if (loadMoreBtn) {
            loadMoreBtn.style.display = hasNextFeedPage ? "block" : "none";
            loadMoreBtn.innerText = "โหลดโพสต์เพิ่มเติม";
        }

    } catch (e) {
        console.error(e);
        if (!append) {
            container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 3rem;">เกิดข้อผิดพลาดในการโหลดฟีด</div>`;
        }
    } finally {
        isLoadingFeed = false;
    }
}

function loadMoreFeed() {
    if (hasNextFeedPage && !isLoadingFeed) {
        loadFeedReviews(currentFeedPage + 1, true);
    }
}

// Interactive Like Button & Double-Tap Heart
function toggleLikePost(postId) {
    const btn = document.getElementById(`like_btn_${postId}`);
    const likesVal = document.getElementById(`likes_val_${postId}`);
    if (!btn || !likesVal) return;

    const isLiked = likedPostsSet.has(postId);
    let count = parseInt(likesVal.innerText) || 0;

    if (isLiked) {
        likedPostsSet.delete(postId);
        btn.classList.remove("liked");
        likesVal.innerText = Math.max(0, count - 1);
        showToast("ยกเลิกการถูกใจ");
    } else {
        likedPostsSet.add(postId);
        btn.classList.add("liked");
        likesVal.innerText = count + 1;
        showToast("ถูกใจโพสต์แล้ว ❤️");
    }
}

function triggerDoubleTapLike(postId) {
    const heart = document.getElementById(`heart_burst_${postId}`);
    if (heart) {
        heart.classList.add("pop");
        setTimeout(() => heart.classList.remove("pop"), 800);
    }
    if (!likedPostsSet.has(postId)) {
        toggleLikePost(postId);
    }
}

// Interactive Save Button
function toggleSavePost(postId) {
    const btn = document.getElementById(`save_btn_${postId}`);
    if (!btn) return;
    const isSaved = savedPostsSet.has(postId);
    if (isSaved) {
        savedPostsSet.delete(postId);
        btn.classList.remove("saved");
        showToast("ลบออกจากบันทึกแล้ว");
    } else {
        savedPostsSet.add(postId);
        btn.classList.add("saved");
        showToast("บันทึกโพสต์แล้ว ✨");
    }
}

// Share Post
function sharePost(postId) {
    if (navigator.share) {
        navigator.share({
            title: 'ZoneIn Travel Feed',
            text: 'ดูรีวิวสถานที่ท่องเที่ยวนี้บน ZoneIn!',
            url: window.location.href,
        }).catch(() => {});
    } else {
        showToast("คัดลอกลิงก์โพสต์เรียบร้อยแล้ว 🔗");
    }
}
</script>
{% endblock %}
