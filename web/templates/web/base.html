<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}ZoneIn - สำรวจสถานที่ท่องเที่ยวยอดฮิตและรีวิวล่าสุด{% endblock %}</title>
        <meta name="description"
              content="{% block meta_desc %}ค้นพบสถานที่ท่องเที่ยวยอดฮิต คาเฟ่ แคมป์ปิ้ง และรีวิวจริงจากนักเดินทางทั่วไทย{% endblock %}">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap"
              rel="stylesheet">
        <style>
        :root {
            --bg-body: #0a0e1a;
            --bg-card: #121829;
            --bg-card-hover: #182035;
            --bg-card-glass: rgba(18, 24, 41, 0.75);
            --bg-nav: rgba(10, 14, 26, 0.88);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-color-hover: rgba(99, 102, 241, 0.35);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981;
            --star-gold: #fbbf24;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 4px 10px -2px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1200px;
            height: 350px;
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Top Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-nav);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 1.5rem;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-tagline {
            font-size: 0.75rem;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            margin-left: 0.25rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.45rem 1rem;
            border-radius: var(--radius-full);
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #fff !important;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        /* Main Content Layout */
        .main-wrapper {
            position: relative;
            z-index: 1;
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2.25rem 1.5rem 5rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            z-index: 300;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.88rem;
            background: rgba(10, 14, 26, 0.7);
        }
        </style>
        {% block extra_head %}{% endblock %}
    </head>
    <body>
        <div class="ambient-glow"></div>
        <header class="navbar">
            <div class="nav-container">
                <a href="/" class="brand-logo">
                    <div class="brand-icon">📍</div>
                    <span>ZoneIn</span>
                    <span class="brand-tagline">Review Hub</span>
                </a>
                <div class="nav-actions">
                    <a href="/" class="nav-btn active">หน้าแรก</a>
                </div>
            </div>
        </header>
        <main class="main-wrapper">
            {% block content %}{% endblock %}
        </main>
        <footer class="footer">
            <p>© 2026 ZoneIn Travel & Review Community. สำรวจและแบ่งปันประสบการณ์การท่องเที่ยวทั่วไทย</p>
        </footer>
        <div id="toast" class="toast"></div>
        {% block extra_scripts %}{% endblock %}
    </body>
</html>
