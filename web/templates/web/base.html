<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZoneIn - สำรวจสถานที่ท่องเที่ยวยอดฮิตและรีวิวล่าสุด{% endblock %}</title>
    <meta name="description" content="{% block meta_desc %}ค้นพบสถานที่ท่องเที่ยวยอดฮิต คาเฟ่ แคมป์ปิ้ง และรีวิวจริงจากนักเดินทางทั่วไทย{% endblock %}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #131b2e;
            --bg-card-hover: #1a243d;
            --bg-nav: rgba(11, 15, 25, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #10b981;
            --star-gold: #fbbf24;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-full: 9999px;
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-nav);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 1.5rem;
        }

        .nav-container {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: #fff;
            padding: 0.25rem 0.65rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition-smooth);
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Main Content Container */
        .main-container {
            flex: 1;
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.35rem;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            font-size: 0.9rem;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            background: rgba(11, 15, 25, 0.5);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <span>ZoneIn</span>
                <span class="logo-badge">Feed</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link active">หน้าแรก</a>
                <a href="/admin/" class="nav-link" target="_blank">ระบบหลังบ้าน</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 ZoneIn - แพลตฟอร์มสำรวจสถานที่ท่องเที่ยวยอดนิยมและรีวิวจากนักเดินทาง</p>
    </footer>

    <div id="toast" class="toast"></div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
