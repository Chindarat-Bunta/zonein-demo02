<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}ZoneIn - ฟีดรีวิวสถานที่ท่องเที่ยว{% endblock %}</title>
    <meta name="description" content="{% block meta_desc %}แชร์และค้นพบสถานที่ท่องเที่ยว คาเฟ่ และรีวิวจริงในสไตล์ฟีดโซเชียลมีเดีย{% endblock %}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #000000;
            --bg-card: #121212;
            --bg-card-hover: #181818;
            --bg-nav: rgba(0, 0, 0, 0.88);
            --border-color: #262626;
            --primary: #6366f1;
            --accent-pink: #e1306c;
            --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --ig-story-glow: rgba(225, 48, 108, 0.4);
            --star-gold: #fbbf24;
            --danger: #ef4444;
            --text-main: #f5f5f5;
            --text-muted: #a8a8a8;
            --text-dim: #737373;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --shadow-card: 0 4px 24px -2px rgba(0, 0, 0, 0.8);
            --transition-smooth: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Prompt', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 75px; /* space for bottom nav */
        }

        /* App Container (Instagram Mobile-First Layout) */
        .app-shell {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        @media (max-width: 520px) {
            .app-shell {
                border-left: none;
                border-right: none;
            }
        }

        /* Top Bar */
        .app-top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-nav);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            height: 54px;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .brand-logo-btn span.highlight {
            background: var(--ig-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dropdown-chevron {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .top-action-icons {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.3rem;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        .icon-btn:hover {
            color: var(--accent-pink);
            transform: scale(1.08);
        }

        /* Bottom Navigation Bar (Instagram Style) */
        .app-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 52px;
            background: var(--bg-nav);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            padding: 0 0.5rem;
        }

        .nav-tab-item {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        .nav-tab-item.active, .nav-tab-item:hover {
            color: #ffffff;
        }

        .nav-tab-item.active svg {
            stroke-width: 2.4;
        }

        .nav-avatar-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #e1306c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            border: 1.5px solid transparent;
        }

        .nav-tab-item.active .nav-avatar-circle {
            border-color: #fff;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: #262626;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: none;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <!-- Instagram Top Bar -->
        <header class="app-top-bar">
            <a href="/" class="brand-logo-btn">
                <span>Zone<span class="highlight">In</span></span>
                <span class="dropdown-chevron">▼</span>
            </a>
            <div class="top-action-icons">
                <button type="button" class="icon-btn" title="การแจ้งเตือน" onclick="showToast('ยังไม่มีการแจ้งเตือนใหม่')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                    </svg>
                </button>
                <button type="button" class="icon-btn" title="แชท / ข้อความ" onclick="showToast('ระบบข้อความกำลังพัฒนา')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Feed Content Area -->
        <main style="flex: 1; width: 100%;">
            {% block content %}{% endblock %}
        </main>

        <!-- Instagram Bottom Navigation Bar -->
        <nav class="app-bottom-nav">
            <a href="/" class="nav-tab-item active" title="หน้าแรก">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
            <a href="javascript:void(0)" class="nav-tab-item" onclick="showToast('ค้นหาสถานที่ & รีวิว')" title="ค้นหา">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </a>
            <a href="javascript:void(0)" class="nav-tab-item" onclick="showToast('เพิ่มโพสต์รีวิวใหม่')" title="สร้างโพสต์">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </a>
            <a href="javascript:void(0)" class="nav-tab-item" onclick="showToast('สถานที่ที่บันทึกไว้ (Wishlist)')" title="บันทึก">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
            </a>
            <a href="/admin/" class="nav-tab-item" title="โปรไฟล์ & หลังบ้าน">
                <div class="nav-avatar-circle">T</div>
            </a>
        </nav>
    </div>

    <div id="toast" class="toast"></div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
